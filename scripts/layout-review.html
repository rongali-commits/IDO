<!doctype html>
<!-- Local-only QA fixture. Temporarily serve from public/__layout-review.html; never deploy it. -->
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Noerong local layout review</title>
<style>body{margin:0;background:#dde1da;font:13px Arial;color:#162019}form{display:flex;flex-wrap:wrap;gap:8px;padding:12px}input,select,button{font:inherit;padding:8px}#stage{overflow:auto;padding:8px}iframe{display:block;border:0;background:#f3f1e9;transform-origin:top left}pre{white-space:pre-wrap;margin:8px;padding:12px;background:white;max-height:65px;overflow:auto}</style></head>
<body><form id="controls"><label>Width <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select></label><label>Page <input id="path" value="/" size="36"></label><button>Load page</button><button type="button" id="inspect">Inspect layout</button><button type="button" id="process">Process section</button><button type="button" id="footer">Footer</button><button type="button" id="menu">Toggle menu</button><button type="button" id="batch">Audit all pages</button></form><pre id="report">Ready</pre><div id="stage"><iframe id="page" title="Website at selected viewport"></iframe></div>
<script>
const frame=document.getElementById('page'),report=document.getElementById('report'),width=document.getElementById('width'),path=document.getElementById('path');
const params=new URLSearchParams(location.search);width.value=params.get('width')||'390';path.value=params.get('path')||'/';
function resize(){const w=Number(width.value),scale=Math.min(1,(innerWidth-16)/w);frame.style.width=w+'px';frame.style.height='850px';frame.style.transform=`scale(${scale})`;document.getElementById('stage').style.height=850*scale+'px';document.body.style.overflowX='hidden'}
function inspect(){const d=frame.contentDocument,v=frame.contentWindow,ww=d.documentElement.clientWidth;const overflow=[...d.querySelectorAll('h1,h2,h3,p,a,button,article,img,video')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.right>ww+2||r.left< -2)}).map(e=>({tag:e.tagName,text:(e.textContent||e.getAttribute('alt')||'').trim().slice(0,75),right:Math.round(e.getBoundingClientRect().right)}));const gaps=[...d.querySelectorAll('.method-grid article')].map(e=>Math.round(e.querySelector('h3').getBoundingClientRect().top-e.querySelector('span').getBoundingClientRect().bottom));const data={page:v.location.pathname,width:ww,title:d.title,h1:d.querySelector('h1')?.textContent,overflow,processNumberToTitle:gaps,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src')),emptyLinks:[...d.links].filter(a=>!a.textContent.trim()&&!a.querySelector('img')&&!a.getAttribute('aria-label')).map(a=>a.href),coverFit:[...d.querySelectorAll('.project-motion-cover img')].map(i=>v.getComputedStyle(i).objectFit)};report.textContent=JSON.stringify(data,null,2);return data}
function load(){resize();frame.src=path.value;}
document.getElementById('controls').onsubmit=e=>{e.preventDefault();load()};frame.onload=()=>{inspect();if(params.get('section'))frame.contentDocument.querySelector(params.get('section'))?.scrollIntoView()};document.getElementById('inspect').onclick=inspect;
document.getElementById('process').onclick=()=>frame.contentDocument.querySelector('.method-grid')?.scrollIntoView();document.getElementById('footer').onclick=()=>frame.contentDocument.querySelector('footer')?.scrollIntoView();document.getElementById('menu').onclick=()=>{const m=frame.contentDocument.querySelector('.mobile-menu');m.open=!m.open};
const routes=['/','/projects','/about','/contact','/essays','/projects/noerong-proposals','/projects/growthdesk','/projects/clientdesk','/projects/leaddesk-ai','/projects/followdesk','/projects/reviewdesk','/projects/sourceroom','/projects/ledgerflow','/projects/prospectlab','/projects/proofread','/essays/would-i-exist-without-world-war-ii','/essays/the-universe-is-not-a-coffee-mug','/essays/the-british-empire-didnt-vanish-it-became-background-noise'];
document.getElementById('batch').onclick=async()=>{const results=[];for(const w of [320,390,768,1024,1440])for(const route of routes){width.value=String(w);path.value=route;resize();await new Promise(resolve=>{frame.onload=resolve;frame.src=route});await frame.contentDocument.fonts.ready;await new Promise(r=>setTimeout(r,80));results.push(inspect());report.textContent=`Checked ${results.length}/${routes.length*5}`;}frame.onload=inspect;report.textContent=JSON.stringify({tested:results.length,failures:results.filter(r=>r.overflow.length||r.brokenImages.length||!r.h1||r.title.includes('404')),coverFit:[...new Set(results.flatMap(r=>r.coverFit))],process:results.filter(r=>r.page==='/').map(r=>({width:r.width,gaps:r.processNumberToTitle}))},null,2)};
if(params.get('visual')){document.getElementById('controls').style.display='none';report.style.display='none';}
load();
</script></body></html>
